services:
  neo4j-db:
    image: neo4j:latest
    deploy:
      resources:
        limits:
          memory: 2G    # Hard ceiling: Container is killed if it exceeds this
          cpus: '1.0'   # Limits the DB to 1 CPU core
        reservations:
          memory: 1G    # Guaranteed minimum RAM
    container_name: ppb-neo4j
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt Protocol (for Python)
    environment:
      - NEO4J_AUTH=neo4j/password
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s # Give more between checks
      timeout: 10s # Give the shell time to respond
      retries: 10 # Number of attempts
      start_period: 30s # Give Neo4j some seconds before Docker even starts judging it

  # The Python Pipeline Service
  app:
    build: . 
    deploy:
      resources:
        limits:
          memory: 4G    # Caps your Python pipeline's RAM
          cpus: '2.0'   # Limits Python to 2 CPU cores
    container_name: ppb-pipeline
    command: tail -f /dev/null
    depends_on:
      neo4j-db:
        condition: service_healthy 
    environment:
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - FAST_LLM_MODEL=${FAST_LLM_MODEL}
      - SMART_LLM_MODEL=${SMART_LLM_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - RAG_K=${RAG_K}
      - PYTHONUNBUFFERED=1
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./.env:/app/.env
      - ./data:/app/data
      - ./scripts:/app/scripts 
      - ./tests:/app/tests
