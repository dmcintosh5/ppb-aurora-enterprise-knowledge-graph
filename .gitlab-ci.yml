stages:
  - test
  - build

# Pipeline Verification
test_pipeline:
  stage: test
  image: python:3.12-slim
  services:
    - name: neo4j:latest
      alias: neo4j-db
  variables:
    NEO4J_AUTH: "neo4j/password"
    NEO4J_URI: "bolt://neo4j-db:7687"
    NEO4J_PASSWORD: "password"
  script:
    - pip install -r requirements.txt
    - python scripts/run_data_pipeline.py
    - python tests/test_data_pipeline.py

# Build the final image (for the on-prem registry)
build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t ppb-dais:latest .